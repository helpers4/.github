name: Manual Fallback - Trigger Website Update (Action)

# Manual fallback only.
# Primary automatic trigger lives in helpers4/action/.github/workflows/release.yml.
# Use this workflow to force a website docs regeneration for Action docs.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    # No checkout, no GITHUB_TOKEN use — the composite action mints its own token via the
    # GitHub App credentials passed in `with:`, so the default token needs zero permissions here.
    permissions: {}
    steps:
      - name: Manual fallback notice
        run: |
          echo "ℹ️ This workflow is a manual fallback."
          echo "ℹ️ Normal website updates are triggered automatically by action release."

      - name: Trigger website update
        uses: helpers4/action/trigger-website-update@main
        with:
          event-type: action-release
          payload: '{"version": "latest"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}

      - name: Summary
        run: echo "✅ Website update triggered for Action docs"
