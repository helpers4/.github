name: Manual Fallback - Trigger Website Update (DevContainer)

# Manual fallback only.
# Primary automatic trigger lives in helpers4/devcontainer/.github/workflows/release.yml.
# Use this workflow to force a website docs regeneration for DevContainer docs.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    # No checkout, no GITHUB_TOKEN use — the composite action mints its own token via the
    # GitHub App credentials passed in `with:`, so the default token needs zero permissions here.
    permissions: {}
    steps:
      - name: Manual fallback notice
        run: |
          echo "ℹ️ This workflow is a manual fallback."
          echo "ℹ️ Normal website updates are triggered automatically by devcontainer release."

      - name: Trigger website update
        uses: helpers4/action/dispatch-with-fallback@main
        with:
          target-owner: helpers4
          target-repo: website
          event-type: devcontainer-release
          payload: '{"version": "latest"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}

      - name: Summary
        run: echo "✅ Website update triggered for DevContainer docs"
