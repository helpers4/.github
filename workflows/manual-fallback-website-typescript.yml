name: Manual Fallback - Trigger Website Update (TypeScript)

# Manual fallback only.
# Primary automatic trigger lives in helpers4/typescript/.github/workflows/release.yml.
# Use this workflow to force a website docs regeneration for a specific TypeScript version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "TypeScript version to rebuild docs for (e.g. 2.0.0-alpha.9)"
        required: true
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Manual fallback notice
        run: |
          echo "ℹ️ This workflow is a manual fallback."
          echo "ℹ️ Normal website updates are triggered automatically by typescript release."

      - name: Get Trigganator token
        id: trigganator
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TRIGGANATOR_ID }}
          private-key: ${{ secrets.TRIGGANATOR_KEY }}
          owner: helpers4
          repositories: website

      - name: Trigger website update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.trigganator.outputs.token }}
          repository: helpers4/website
          event-type: typescript-release
          client-payload: "{\"version\": \"${{ inputs.version }}\"}"

      - name: Summary
        run: echo "✅ Website update triggered for TypeScript v${{ inputs.version }}"
