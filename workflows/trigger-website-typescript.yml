name: Trigger Website Update - TypeScript

# Manual trigger to force a website rebuild for TypeScript docs.
# Normally triggered automatically by the typescript repo's release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "TypeScript version to rebuild docs for (e.g. 2.0.0-alpha.9)"
        required: true
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get Trigganator token
        id: trigganator
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TRIGGANATOR_ID }}
          private-key: ${{ secrets.TRIGGANATOR_KEY }}
          owner: helpers4
          repositories: website

      - name: Trigger website update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.trigganator.outputs.token }}
          repository: helpers4/website
          event-type: typescript-release
          client-payload: '{"version": "${{ inputs.version }}"}'
      - run: echo "✅ Website update triggered for TypeScript v${{ inputs.version }}"
