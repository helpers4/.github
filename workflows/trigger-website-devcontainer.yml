name: Trigger Website Update - DevContainer

# Manual trigger to force a website rebuild for DevContainer docs.
# Normally triggered automatically by the devcontainer repo's release workflow.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get Trigganator token
        id: trigganator
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TRIGGANATOR_ID }}
          private-key: ${{ secrets.TRIGGANATOR_KEY }}
          owner: helpers4
          repositories: website

      - name: Trigger website update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.trigganator.outputs.token }}
          repository: helpers4/website
          event-type: devcontainer-release
          client-payload: '{"version": "latest"}'
      - run: echo "✅ Website update triggered for DevContainer docs"
